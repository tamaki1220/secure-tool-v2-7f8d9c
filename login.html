<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>menulette</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        form{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        input{
            margin: 8px 0;
            padding: 5px;
        }

        #login{
            background-color: rgb(0, 115, 255);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            padding: 8px 16px;
        }
    </style>
</head>

<body>
  <!-- 静的サイト（GitHub Pages）用にフォームを調整 -->
  <form id="loginForm">   
    <h2>ログイン</h2>
    <div id="error-message" style="color: red; display: none;">キーが正しくありません</div>
    <input type="text" id="user_id" name="userId" placeholder="ユーザーID">
    <input type="submit" id="login" value="ログイン">
  </form>

  <script>
    const SECRET_KEY = "tamaki1220_araishi";
    
    // 正しく変数名を宣言して定義します
    const urlParams = new URLSearchParams(window.location.search);
    const userKey = urlParams.get('key');

    // 1. URLパラメータに正しいキーが含まれている場合は自動で calender.html に遷移する
    if (userKey === SECRET_KEY) {
        window.location.href = "calender.html";
    }

    // 2. フォームから手動でログインする場合の処理
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // フォームのデフォルト送信を防止
        const inputVal = document.getElementById('user_id').value;
        
        if (inputVal === "admin" || userKey === SECRET_KEY) {
            window.location.href = "calender.html";
        } else {
            // エラーメッセージ用要素がない場合はアラートで代用、または必要に応じてHTMLに要素を追加
            alert("ユーザーIDまたはキーが正しくありません");
        }
    });
  </script>
</body>
</html>
