<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>menulette</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        form{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        input{
            margin: 8px 0;
            padding: 5px;
        }

        #login{
            background-color: rgb(0, 115, 255);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            padding: 8px 16px;
        }
    </style>
</head>

<body>
  <form id="loginForm">   
    <h2>ログイン</h2>
    <!-- エラーメッセージ用の表示エリア -->
    <div id="error-message" style="color: red; display: none; margin-bottom: 8px;">キーが正しくありません</div>
    
    <input type="text" id="user_id" name="userId" placeholder="ユーザーID">
    <input type="submit" id="login" value="ログイン">
  </form>

  <script>
    const SECRET_KEY = "tamaki1220_araishi";

    // ログインボタンが押された（フォームが送信された）ときの処理
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // フォームのデフォルト送信（ページのリロードなど）を防止

        // URLからキーを取得
        const urlParams = new URLSearchParams(window.location.search);
        const userKey = urlParams.get('key');
        
        // URLのキーが正しいかチェック
        if (userKey === SECRET_KEY) {
            // 正しければ calender.html に遷移する
            window.location.href = "calender.html";
        } else {
            // 間違っている場合はエラーメッセージを表示する
            document.getElementById('error-message').style.display = 'block';
        }
    });
  </script>
</body>
</html>
